{% extends "base.html" %}
{% block title %}เพิ่มสินค้า | Mobile Shop{% endblock %}
{% block content %}
<div class="form-page"><div class="form-card">
<h1>เพิ่มข้อมูลสินค้า</h1><p>INSERT INTO PRODUCT</p>
<form method="post">
<div class="grid2"><label>รหัสสินค้า<input name="product_id" maxlength="5" placeholder="P0005" required></label><label>ชื่อสินค้า<input name="product_name" placeholder="Galaxy A56" required></label></div>
<div class="grid2"><label>ยี่ห้อ<input name="brand" placeholder="Samsung" required></label><label>รุ่น<input name="model" placeholder="A56"></label></div>
<div class="grid2"><label>ราคา<input type="number" step="0.01" min="0" name="price" placeholder="15900" required></label><label>จำนวนคงเหลือ<input type="number" min="0" name="stock_qty" placeholder="10" required></label></div>
<div class="form-actions"><a class="btn btn-muted" href="{{ url_for('products') }}">ยกเลิก</a><button class="btn" type="submit">บันทึกข้อมูล</button></div>
</form></div></div>
{% endblock %}
